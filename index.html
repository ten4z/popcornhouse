<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fogão Debug Tool</title>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    background:
        linear-gradient(
            to top,
            #ffd84f 0%,
            #fff2a8 45%,
            #ffffff 100%
        );
}

canvas{
    display:block;
}

#sidebar{

    position:fixed;

    top:20px;
    right:20px;

    display:flex;
    flex-direction:column;

    gap:10px;

    z-index:9999;
}

#orbitToggle{

    padding:12px;

    border:none;
    border-radius:8px;

    background:#202020;

    color:white;

    cursor:pointer;

    font-family:Arial;
}

#orbitToggle.off{
    background:#b71c1c;
}

#coords{

    position:fixed;

    left:20px;
    top:20px;

    min-width:220px;

    padding:12px;

    border-radius:8px;

    background:rgba(0,0,0,.85);

    color:#00ff88;

    font-family:Consolas,monospace;

    z-index:9999;

    pointer-events:none;

    line-height:1.5em;
}

</style>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

</head>
<body>

<div id="coords">

x: 0<br>
y: 0<br>
z: 0

</div>

<div id="sidebar">

    <button id="orbitToggle">
        Orbit: ON
    </button>

</div>

<script type="module">
    import * as THREE from "three";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { OBJLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
import { MTLLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/MTLLoader.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.setClearColor(0x000000, 0);

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const orbitButton = document.getElementById("orbitToggle");
orbitButton.addEventListener("click", () => {
    controls.enabled = !controls.enabled;
    orbitButton.textContent = controls.enabled ? "Orbit: ON" : "Orbit: OFF";
    orbitButton.classList.toggle("off", !controls.enabled);
});

function addDirectionalLight(x, y, z, intensity) {
    const light = new THREE.DirectionalLight(0xffffff, intensity);
    light.position.set(x, y, z);
    scene.add(light);
    return light;
}

scene.add(new THREE.AmbientLight(0xffffff, 3));

addDirectionalLight(8, 10, 6, 8);
addDirectionalLight(-8, 5, 5, 4);
addDirectionalLight(0, 5, -10, 4);

const lamp = new THREE.PointLight(0xffffff, 150, 50);
lamp.position.set(0, 5, 0);
scene.add(lamp);

const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
);

bulb.position.copy(lamp.position);
scene.add(bulb);

const coordsDiv = document.getElementById("coords");

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
);

scene.add(marker);

let fogaoMesh = null;

function createCubeMarker(size, position) {

    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(size, size, size),
        new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            emissive: 0x006600,
            metalness: 0.2,
            roughness: 0.4
        })
    );

    cube.position.copy(position);

    cube.add(
        new THREE.LineSegments(
            new THREE.EdgesGeometry(cube.geometry),
            new THREE.LineBasicMaterial({ color: 0x000000 })
        )
    );

    return cube;
}
const popcornSeeds = [];
const MIN_DISTANCE = 0.30;
const fallingSeeds = [];

function createDebugPan() {

    const pan = new THREE.Group();

    const geometry = new THREE.CylinderGeometry(
        1.25,
        0.85,
        2.5,
        64
    );

    const body = new THREE.Mesh(
        geometry,
        new THREE.MeshNormalMaterial({
            transparent: true,
            opacity: 0.20,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        })
    );

    const wire = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({
            color: 0x000000,
            depthTest: false
        })
    );

    const center = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 16, 16),
        new THREE.MeshBasicMaterial({
            color: 0xff0000,
            depthTest: false
        })
    );

    pan.add(body, wire, center);

    return pan;
}
//////////////////////////////////////////////
// CONSTANTES
//////////////////////////////////////////////
const GRAIN_RADIUS = 0.12;
const SPAWN_INTERVAL = 80;
const GRAVITY = 0.003;
const PUSH_FORCE = 0.04;
const PAN_BOTTOM = -1.15;
const PAN_RADIUS = 1.15;


const panDebug = createDebugPan();

new MTLLoader().load("./objetos/cooktop.mtl", materials => {

    materials.preload();

    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);

    objLoader.load(
    "./objetos/cooktop.obj",

    fogao => {

        fogao.scale.set(0.2, 0.2, 0.2);

        const box = new THREE.Box3().setFromObject(fogao);
        const center = box.getCenter(new THREE.Vector3());

        fogao.position.sub(center);
        fogao.position.set(0, 0, 0);

        fogao.traverse(child => {

            if (!child.isMesh || !child.material)
                return;

            child.material.metalness = 0.8;
            child.material.roughness = 0.3;
            child.material.envMapIntensity = 2;
            child.material.needsUpdate = true;

        });

        scene.add(fogao);
        fogaoMesh = fogao;

        // --------------------
        // PANELA PRINCIPAL
        // --------------------

        

        panDebug.position.set(-5, 2, 0.5 );

        fogao.add(panDebug);

        // --------------------
        // PANELA DESTINO
        // --------------------

        const secondPan = createDebugPan();

        secondPan.position.set(
            5.75,
            2,
            0.5
        );

        fogao.add(secondPan);

        // --------------------
        // MILHOS
        // --------------------

        

        fillPanWithSeeds(
            panDebug,
            popcornSeeds
        );

        controls.target.set(
            0,
            0.5,
            0
        );

        controls.update();

    
});

function isValidSeedPosition(x, y, z) {
 
for (const seed of popcornSeeds) {
 
const dx = seed.position.x - x;
const dy = seed.position.y - y;
const dz = seed.position.z - z;
 
const distance = Math.sqrt(
dx * dx +
dy * dy +
dz * dz
);
 
if (distance < MIN_DISTANCE)
return false;
}
 
return true;
}
});
        
// ---------------------------
// HELPERS
// ---------------------------


//////////////////////////////////////////////
// Criar os Grãos
//////////////////////////////////////////////

function createSeed(){
 
const seed = new THREE.Mesh(
 
new THREE.SphereGeometry(
GRAIN_RADIUS,
10,
10
),
 
new THREE.MeshStandardMaterial({
 
color:0xffd54f,
roughness:0.9,
metalness:0.05
 
})
 
);
 
seed.userData.velocity =
new THREE.Vector3(
0,
PUSH_FORCE,
0
);
 
return seed;
}

//////////////////////////////////////////////
// Enchimento da panela
//////////////////////////////////////////////

function fillPanWithSeeds(pan){
 
    setInterval(()=>{
     
    const seed = createSeed();
     
    const angle =
Math.random() * Math.PI * 2;
 
const radius =
Math.random() * 0.7;
 
seed.position.set(
Math.cos(angle) * radius,
PAN_BOTTOM,
Math.sin(angle) * radius
);
     
    pan.add(seed);
     
    popcornSeeds.push(seed);
     
    }, SPAWN_INTERVAL);
    }





//////////////////////////////////////////////
// ANIMATE
//////////////////////////////////////////////

function animate(){
 
requestAnimationFrame(animate);
 
const MIN_DIST = GRAIN_RADIUS * 2;
 
for(let i = 0; i < popcornSeeds.length; i++){
 
const a = popcornSeeds[i];
 
//////////////////////////////////////
// gravidade
//////////////////////////////////////
 
a.userData.velocity.y -= GRAVITY;
 
//////////////////////////////////////
// colisão entre grãos
//////////////////////////////////////
 
for(let j = i + 1; j < popcornSeeds.length; j++){
 
const b = popcornSeeds[j];
 
const dx = b.position.x - a.position.x;
const dy = b.position.y - a.position.y;
const dz = b.position.z - a.position.z;
 
const dist = Math.sqrt(
dx*dx +
dy*dy +
dz*dz
);
 
if(
dist <= 0.0001 ||
dist > MIN_DIST
){
continue;
}
 
const overlap =
MIN_DIST - dist;
 
const nx = dx / dist;
const ny = dy / dist;
const nz = dz / dist;
 
const push =
overlap * 0.08;
 
a.userData.velocity.x -= nx * push;
a.userData.velocity.y -= ny * push;
a.userData.velocity.z -= nz * push;
 
b.userData.velocity.x += nx * push;
b.userData.velocity.y += ny * push;
b.userData.velocity.z += nz * push;
}
 
//////////////////////////////////////
// amortecimento
//////////////////////////////////////
 
a.userData.velocity.multiplyScalar(
0.985
);
 
//////////////////////////////////////
// movimento
//////////////////////////////////////
 
a.position.add(
a.userData.velocity
);
 
//////////////////////////////////////
// fundo da panela
//////////////////////////////////////
 
if(a.position.y < PAN_BOTTOM){
 
a.position.y = PAN_BOTTOM;
 
if(a.userData.velocity.y < 0){
 
a.userData.velocity.y *= -0.15;
}
}
 
//////////////////////////////////////
// parede lateral
//////////////////////////////////////
 
const radial = Math.sqrt(
a.position.x * a.position.x +
a.position.z * a.position.z
);
 
// altura da panela
const panHeight = 2.5;
 
// converte Y para faixa 0..1
const t = Math.max(
0,
Math.min(
1,
(a.position.y - PAN_BOTTOM) / panHeight
)
);
 
// raio varia da base ao topo
const currentRadius =
0.85 + (1.25 - 0.85) * t;
 
if(
radial > currentRadius &&
a.position.y < 1.2
){
 
const angle = Math.atan2(
a.position.z,
a.position.x
);
 
a.position.x =
Math.cos(angle) *
currentRadius;
 
a.position.z =
Math.sin(angle) *
currentRadius;
 
a.userData.velocity.x *= -0.25;
a.userData.velocity.z *= -0.25;
}
}
 
controls.update();
 
renderer.render(
scene,
camera
);
}
 
animate();

let touchStart = null;
let touchEnd = null;

renderer.domElement.addEventListener(
"pointerdown",
e => {
 
touchStart = {
x: e.clientX,
y: e.clientY
};
 
}
);
 
renderer.domElement.addEventListener(
"pointerup",
e => {
 
if(!touchStart) return;
 
touchEnd = {
x: e.clientX,
y: e.clientY
};
 
aplicarForcaEmGraos(
touchStart,
touchEnd
);
 
}
);

function aplicarForcaEmGraos(
start,
end
){
 
const dx = end.x - start.x;
 
const dy = start.y - end.y;
 
const distance =
Math.sqrt(
dx * dx +
dy * dy
);
 
const power =
Math.min(
distance,
300
) / 300;
 
const direction =
new THREE.Vector3(
 
dx * 0.01,
 
dy * 0.015 + 0.5,
 
0
 
).normalize();
 
//////////////////////////////////////////////////
// seleciona quase todos os grãos
//////////////////////////////////////////////////
 
const grains = popcornSeeds.filter(
grain => grain.position.y > -0.9
);
 
grains.forEach(grain => {
 
const spread =
new THREE.Vector3(
 
(Math.random()-0.5)*0.15,
Math.random()*0.10,
(Math.random()-0.5)*0.15
 
);
 
grain.userData.velocity.add(
 
direction
.clone()
.multiplyScalar(
0.25 + power * 0.5
)
.add(spread)
 
);
 
});
 
}

//////////////////////////////////////////////
// RESIZE
//////////////////////////////////////////////

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
        window.innerWidth/
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
